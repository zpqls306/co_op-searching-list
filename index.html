<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>코업 파인더 — 친구랑 할 게임 찾기</title>
<style>
  :root{
    --bg:#14171c;
    --panel:#1c2027;
    --panel2:#22262e;
    --border:#2e333c;
    --text:#e8eaed;
    --sub:#9099a6;
    --accent:#7cd992;
    --accent-dim:#4f7a5c;
    --amber:#e8a33d;
    --danger:#e2645a;
    --font-head:"Space Grotesk","Pretendard",-apple-system,sans-serif;
    --font-body:"Pretendard",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:var(--font-body);
    line-height:1.5;
  }
  @font-face{
    font-family:"Space Grotesk";
    src:local("Space Grotesk");
  }
  header{
    padding:28px 24px 20px;
    border-bottom:1px solid var(--border);
  }
  header h1{
    font-family:var(--font-head);
    font-weight:700;
    font-size:1.6rem;
    margin:0 0 4px;
    letter-spacing:-0.01em;
  }
  header h1 .dot{color:var(--accent);}
  header p{
    margin:0;
    color:var(--sub);
    font-size:0.92rem;
  }
  .wrap{
    max-width:1180px;
    margin:0 auto;
    padding:0 24px 60px;
  }
  .panel{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:6px;
    padding:18px 20px;
    margin-top:20px;
  }
  .section-label{
    font-size:0.78rem;
    color:var(--sub);
    margin:0 0 8px;
    font-weight:600;
  }
  .chip-row{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:16px;
  }
  .chip{
    border:1px solid var(--border);
    background:var(--panel2);
    color:var(--sub);
    padding:6px 12px;
    border-radius:4px;
    font-size:0.85rem;
    cursor:pointer;
    user-select:none;
    transition:border-color .12s, color .12s, background .12s;
  }
  .chip:hover{border-color:var(--accent-dim);}
  .chip.active{
    background:rgba(124,217,146,0.12);
    border-color:var(--accent);
    color:var(--accent);
  }
  .row-flex{
    display:flex;
    flex-wrap:wrap;
    gap:20px;
    align-items:flex-end;
  }
  .field{
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  select, input[type="text"]{
    background:var(--panel2);
    border:1px solid var(--border);
    color:var(--text);
    padding:8px 10px;
    border-radius:4px;
    font-size:0.88rem;
    font-family:var(--font-body);
  }
  .toggle-line{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:0.88rem;
    color:var(--sub);
    cursor:pointer;
  }
  .toggle-line input{accent-color:var(--accent);width:16px;height:16px;}
  button.primary{
    background:var(--accent);
    color:#0c130f;
    border:none;
    padding:10px 20px;
    border-radius:4px;
    font-weight:700;
    font-size:0.9rem;
    cursor:pointer;
  }
  button.primary:hover{filter:brightness(1.08);}
  button.ghost{
    background:transparent;
    border:1px solid var(--border);
    color:var(--sub);
    padding:10px 16px;
    border-radius:4px;
    font-size:0.85rem;
    cursor:pointer;
  }
  button.ghost:hover{border-color:var(--accent-dim);color:var(--text);}
  .status-line{
    margin-top:14px;
    font-size:0.8rem;
    color:var(--sub);
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
  }
  .status-line .cached{color:var(--amber);}
  .status-line .err{color:var(--danger);}
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
    gap:14px;
    margin-top:22px;
  }
  .card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:6px;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    text-decoration:none;
    color:var(--text);
  }
  .card img{
    width:100%;
    aspect-ratio:460/215;
    object-fit:cover;
    background:var(--panel2);
    display:block;
  }
  .card-body{
    padding:12px 14px 14px;
    display:flex;
    flex-direction:column;
    gap:8px;
    flex:1;
  }
  .card-title{
    font-weight:700;
    font-size:0.98rem;
    line-height:1.3;
  }
  .card-meta{
    font-size:0.76rem;
    color:var(--sub);
  }
  .tag-row{
    display:flex;
    flex-wrap:wrap;
    gap:5px;
  }
  .tag-badge{
    font-size:0.7rem;
    padding:2px 7px;
    border-radius:3px;
    background:rgba(124,217,146,0.1);
    color:var(--accent);
    border:1px solid var(--accent-dim);
  }
  .price-row{
    margin-top:auto;
    display:flex;
    align-items:baseline;
    gap:8px;
    justify-content:flex-end;
  }
  .price-orig{
    text-decoration:line-through;
    color:var(--sub);
    font-size:0.8rem;
  }
  .price-final{
    font-weight:700;
    font-size:1rem;
  }
  .discount-badge{
    background:var(--accent);
    color:#0c130f;
    font-weight:700;
    font-size:0.78rem;
    padding:2px 6px;
    border-radius:3px;
    margin-right:auto;
  }
  .free-badge{
    color:var(--accent);
    font-weight:700;
    font-size:0.95rem;
  }
  .empty, .loading{
    text-align:center;
    color:var(--sub);
    padding:60px 20px;
    font-size:0.9rem;
  }
  .loadmore-wrap{
    text-align:center;
    margin-top:24px;
  }
  footer.note{
    color:var(--sub);
    font-size:0.76rem;
    margin-top:30px;
    border-top:1px solid var(--border);
    padding-top:14px;
  }
</style>
</head>
<body>

<header>
  <h1>코업 파인더<span class="dot">.</span></h1>
  <p>가격 · 장르 · 할인 · 협동 유형으로 필터링해서, 친구랑 할 게임을 빠르게 찾아요.</p>
</header>

<div class="wrap">

  <div class="panel">
    <p class="section-label">협동 유형 (하나 이상 선택, 선택 안 하면 전체)</p>
    <div class="chip-row" id="coopChips"></div>

    <p class="section-label">장르 (여러 개 선택 가능, 선택 안 하면 전체)</p>
    <div class="chip-row" id="genreChips"></div>

    <div class="row-flex">
      <div class="field">
        <label class="section-label" style="margin:0">정렬</label>
        <select id="sortSelect">
          <option value="">관련순(리뷰 많은순)</option>
          <option value="Reviews_DESC">리뷰 많은순</option>
          <option value="Price_ASC">낮은 가격순</option>
          <option value="Price_DESC">높은 가격순</option>
          <option value="Released_DESC">최신 출시순</option>
          <option value="Name_ASC">이름순</option>
        </select>
      </div>
      <div class="field">
        <label class="toggle-line"><input type="checkbox" id="specialsOnly"> 할인 중인 게임만</label>
      </div>
      <div class="field" style="flex:1">
        <label class="section-label" style="margin:0">이름으로 검색 (선택)</label>
        <input type="text" id="queryText" placeholder="예: 발헤임, 잇 테이크스 투...">
      </div>
      <div class="field">
        <button class="primary" id="searchBtn">검색</button>
      </div>
    </div>

    <div class="status-line" id="statusLine"></div>
  </div>

  <div id="resultsArea">
    <div class="loading">게임 데이터 불러오는 중...</div>
  </div>

  <div class="loadmore-wrap" id="loadMoreWrap" style="display:none">
    <button class="ghost" id="loadMoreBtn">더 보기</button>
  </div>

  <footer class="note">
    게임 데이터는 하루 두 번 자동으로 갱신돼요(실시간 아님). 협동 인원수(2인/4인 등)는 스팀이 구조화된 데이터로 제공하지 않아서, 정확한 인원수는 각 게임 페이지에서 확인해야 해요. 가격은 원화 기준입니다.
  </footer>

</div>

<script>
// ---------- 상태 ----------
let allGames = [];
let dataGeneratedAt = null;
let selectedCoop = new Set();
let selectedGenres = new Set();
let filteredCache = [];
let shownCount = 0;
const PAGE_SIZE = 24;

// ---------- 데이터 로드 (같은 사이트 안의 정적 JSON — CORS 프록시 불필요) ----------
async function loadData(){
  document.getElementById('resultsArea').innerHTML = '<div class="loading">게임 데이터 불러오는 중...</div>';
  try{
    const res = await fetch('./data/coop-games.json', { cache: 'no-store' });
    if(!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    allGames = data.games || [];
    dataGeneratedAt = data.generatedAt ? new Date(data.generatedAt) : null;

    renderChips('coopChips', data.coopCategories || [], selectedCoop);
    renderChips('genreChips', data.genres || [], selectedGenres);

    document.getElementById('resultsArea').innerHTML = '<div class="empty">협동 유형과 장르를 고른 다음 검색을 눌러줘.</div>';
    setStatus(`데이터 갱신: ${formatAge(dataGeneratedAt)} · 총 ${allGames.length.toLocaleString()}개 수집됨`);
  } catch(e){
    document.getElementById('resultsArea').innerHTML =
      `<div class="empty">게임 데이터를 불러올 수 없어.<br><span style="font-size:0.78rem;color:var(--sub)">${e.message} — data/coop-games.json 파일이 아직 없을 수 있어(첫 GitHub Actions 실행 전).</span></div>`;
    setStatus('데이터 로드 실패', 'err');
  }
}

function formatAge(date){
  if(!date) return '알 수 없음';
  const diffMs = Date.now() - date.getTime();
  const diffMin = Math.floor(diffMs/60000);
  if(diffMin < 60) return `${diffMin}분 전`;
  const diffH = Math.floor(diffMin/60);
  if(diffH < 24) return `${diffH}시간 전`;
  return `${Math.floor(diffH/24)}일 전`;
}

// ---------- 칩 렌더링 ----------
function renderChips(container, items, selectedSet){
  const el = document.getElementById(container);
  el.innerHTML = '';
  items.forEach(item => {
    const chip = document.createElement('div');
    chip.className = 'chip' + (selectedSet.has(item.id) ? ' active' : '');
    chip.textContent = item.description;
    chip.onclick = () => {
      if(selectedSet.has(item.id)){
        selectedSet.delete(item.id);
      } else {
        selectedSet.add(item.id);
      }
      chip.classList.toggle('active');
    };
    el.appendChild(chip);
  });
}

// ---------- 필터링/정렬 (전부 클라이언트에서, 네트워크 요청 없음) ----------
function priceOrInfinity(g){
  return (g.finalPriceCents === null || g.finalPriceCents === undefined) ? Infinity : g.finalPriceCents;
}
function releaseSortValue(g){
  const m = (g.released || '').match(/(\d{4})년(?:\s*(\d{1,2})월)?(?:\s*(\d{1,2})일)?/);
  if(!m) return -Infinity;
  const y = parseInt(m[1],10);
  const mo = m[2] ? parseInt(m[2],10) : 1;
  const d = m[3] ? parseInt(m[3],10) : 1;
  return y*10000 + mo*100 + d;
}
function compareGames(a, b, sortKey){
  switch(sortKey){
    case 'Reviews_DESC': return (b.reviewCount||0) - (a.reviewCount||0);
    case 'Price_ASC': return priceOrInfinity(a) - priceOrInfinity(b);
    case 'Price_DESC': return priceOrInfinity(b) - priceOrInfinity(a);
    case 'Released_DESC': return releaseSortValue(b) - releaseSortValue(a);
    case 'Name_ASC': return a.title.localeCompare(b.title, 'ko');
    default: return 0; // 관련순: 원본 순서(수집 시 리뷰 많은순으로 가져옴) 유지
  }
}

function getFilteredSortedGames(){
  const q = document.getElementById('queryText').value.trim().toLowerCase();
  const specialsOnly = document.getElementById('specialsOnly').checked;
  const sortKey = document.getElementById('sortSelect').value;

  let list = allGames.filter(g => {
    if(selectedCoop.size > 0){
      const hasCoop = (g.categories||[]).some(c => selectedCoop.has(c.id));
      if(!hasCoop) return false;
    }
    if(selectedGenres.size > 0){
      const hasGenre = (g.genres||[]).some(gg => selectedGenres.has(gg.id));
      if(!hasGenre) return false;
    }
    if(specialsOnly && g.discountPct <= 0) return false;
    if(q && !g.title.toLowerCase().includes(q)) return false;
    return true;
  });

  if(sortKey) list = [...list].sort((a,b) => compareGames(a,b,sortKey));
  return list;
}

// ---------- 검색 실행 (네트워크 없이 메모리 안에서 처리) ----------
function runSearch(){
  filteredCache = getFilteredSortedGames();
  shownCount = 0;
  document.getElementById('resultsArea').innerHTML = '<div class="grid" id="gameGrid"></div>';
  renderNextPage(false);
}

function renderNextPage(append){
  const nextItems = filteredCache.slice(shownCount, shownCount + PAGE_SIZE);
  shownCount += nextItems.length;

  if(filteredCache.length === 0){
    document.getElementById('resultsArea').innerHTML = '<div class="empty">조건에 맞는 게임을 찾지 못했어. 필터를 조금 완화해봐.</div>';
    toggleLoadMore(false);
    setStatus(`데이터 갱신: ${formatAge(dataGeneratedAt)} · 총 0개`);
    return;
  }

  renderCards(nextItems, append);
  toggleLoadMore(shownCount < filteredCache.length);
  setStatus(`데이터 갱신: ${formatAge(dataGeneratedAt)} · 조건에 맞는 게임 ${filteredCache.length.toLocaleString()}개`);
}

// ---------- 렌더링 ----------
function formatKrw(cents){
  if(cents === null || cents === undefined) return '가격 정보 없음';
  if(cents === 0) return '무료';
  return Math.round(cents/100).toLocaleString('ko-KR') + '원';
}

function renderCards(items, append){
  const area = document.getElementById('resultsArea');
  let grid = document.getElementById('gameGrid');
  if(!append || !grid){
    area.innerHTML = '<div class="grid" id="gameGrid"></div>';
    grid = document.getElementById('gameGrid');
  }

  items.forEach(it => {
    const card = document.createElement('a');
    card.className = 'card';
    card.href = it.url;
    card.target = '_blank';
    card.rel = 'noopener';

    const priceHtml = it.finalPriceCents === 0
      ? `<span class="free-badge">무료</span>`
      : `${it.discountPct > 0 ? `<span class="discount-badge">-${it.discountPct}%</span>` : ''}
         ${it.origPriceText ? `<span class="price-orig">${it.origPriceText}</span>` : ''}
         <span class="price-final">${formatKrw(it.finalPriceCents)}</span>`;

    const badgeLabels = (it.categories || []).map(c => c.description);

    card.innerHTML = `
      <img src="${it.img}" loading="lazy" alt="${it.title}">
      <div class="card-body">
        <div class="card-title">${it.title}</div>
        <div class="card-meta">${it.released || ''}${it.reviewSummary ? ' · ' + it.reviewSummary : ''}</div>
        <div class="tag-row">${badgeLabels.map(l=>`<span class="tag-badge">${l}</span>`).join('')}</div>
        <div class="price-row">${priceHtml}</div>
      </div>
    `;
    grid.appendChild(card);
  });
}

function setStatus(msg, type){
  const el = document.getElementById('statusLine');
  el.innerHTML = `<span class="${type||''}">${msg}</span>`;
}

function toggleLoadMore(show){
  document.getElementById('loadMoreWrap').style.display = show ? 'block' : 'none';
}

// ---------- 이벤트 바인딩 ----------
document.getElementById('searchBtn').onclick = () => runSearch();
document.getElementById('loadMoreBtn').onclick = () => renderNextPage(true);

loadData();
</script>

</body>
</html>
